name: Build bootc image (DGX Spark)

on:
  push:
    branches: [main]
    paths:
      - Containerfile.dgx-spark
      - scripts/**
      - config/**
      - manifests/**
      - .github/workflows/build-bootc-dgx-spark.yaml
  pull_request:
    branches: [main]
    paths:
      - Containerfile.dgx-spark
      - scripts/**
      - config/**
      - manifests/**
      - .github/workflows/build-bootc-dgx-spark.yaml
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-dgx-spark

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune --all --force
          df -h /

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Build image
        run: |
          sudo podman build \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --file Containerfile.dgx-spark .

      - name: Push image
        if: github.event_name != 'pull_request'
        run: sudo podman push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  tag:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Install oras
        uses: oras-project/setup-oras@v1

      - name: Tag and annotate image
        run: |
          SRC=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

          # Create additional tags (sha short, branch)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BRANCH_TAG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${GITHUB_REF_NAME}

          sudo podman pull "${SRC}"
          sudo podman tag "${SRC}" "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${SHORT_SHA}"
          sudo podman tag "${SRC}" "${BRANCH_TAG}"
          sudo podman push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${SHORT_SHA}"
          sudo podman push "${BRANCH_TAG}"

          # Annotate with OCI metadata
          oras login ${{ env.REGISTRY }} -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

          for tag in "sha-${SHORT_SHA}" "${GITHUB_REF_NAME}"; do
            FULL_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${tag}"
            echo "Annotating ${FULL_TAG}..."

            oras manifest fetch "${FULL_TAG}" | jq \
              --arg src "https://github.com/${{ github.repository }}" \
              --arg rev "${{ github.sha }}" \
              '.annotations = {
                "org.opencontainers.image.title": "hybrid-inference-in-a-box-dgx-spark",
                "org.opencontainers.image.description": "Immutable bootc appliance: MicroShift + vLLM Semantic Router (NVIDIA DGX Spark)",
                "org.opencontainers.image.source": $src,
                "org.opencontainers.image.revision": $rev
              }' > /tmp/annotated-manifest.json

            oras manifest push "${FULL_TAG}" /tmp/annotated-manifest.json
          done
