apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: semantic-router-hostpath
allowHostDirVolumePlugin: true
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegedContainer: false
allowedCapabilities: []
defaultAddCapabilities: []
fsGroup:
  type: RunAsAny
readOnlyRootFilesystem: false
requiredDropCapabilities:
  - ALL
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: MustRunAs
supplementalGroups:
  type: RunAsAny
users:
  - system:serviceaccount:semantic-router:default
volumes:
  - configMap
  - emptyDir
  - hostPath
  - projected
  - secret
